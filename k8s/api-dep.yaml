apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: orthographe-plus
    tiers: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orthographe-plus
      tiers: backend
  template:
    metadata:
      labels:
        app: orthographe-plus
        tiers: backend
    spec:
      # Attente que MongoDB soit accessible avant de lancer le backend
      initContainers:
        - name: wait-for-mongodb
          image: docker.io/library/busybox:1.36.1
          command:
            - 'sh'
            - '-c'
            - 'until nc -z mongodb 27017; do echo "Attente de MongoDB (port 27017)..."; sleep 3; done; echo "MongoDB est accessible !"'
      containers:
        - name: api
          image: orthographe-plus-api:latest
          imagePullPolicy: IfNotPresent
          # Construire la variable MONGODB_URI au démarrage à partir des variables MONGO_*
          command:
            - sh
            - -c
            - >-
              export MONGODB_URI="mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB}?authSource=${MONGO_AUTH_SOURCE}" && exec node dist/src/serveur.js
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: root-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: root-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: jwt-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          # Démarrage
          startupProbe:
            httpGet:
              path: /health-check
              port: 3000
            periodSeconds: 3
            failureThreshold: 10
          # Existant
          livenessProbe:
            httpGet:
              path: /health-check
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Répond
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
