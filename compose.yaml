services:
  mongodb:
    image: mongo:7.0
    container_name: orthographe-plus-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: devpassword
      MONGO_INITDB_DATABASE: orthographe_plus_junior
    ports:
      - "27017:27017"
    volumes:
      # la base de données
      - mongodb-data:/data/db
      # pour importer le dump lors de la première initialisation du volume
      - ./base-de-donnees-mongodb/orthographe_plus_junior:/docker-entrypoint-initdb.d/dump:ro
      - ./db/init/01-restore-dump.sh:/docker-entrypoint-initdb.d/01-restore-dump.sh:ro
    networks:
      - orthographe-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet 'mongodb://mongodb:27017/admin' --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orthographe-plus-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: orthographe_plus_junior
      MONGO_USER: root
      MONGO_PASSWORD: devpassword
      MONGO_AUTH_SOURCE: admin
      JWT_SECRET: HYdKkSSuYplNyJF3fDB2OzoARNmHpknmAivv0TNVu0U
      CORS_ORIGIN: ""
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - orthographe-net

volumes:
  mongodb-data:
    driver: local

networks:
  orthographe-net:
    driver: bridge
